<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d6cbc1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon180.png?v=3">
<link rel="apple-touch-icon" href="icon180.png?v=3">
<link rel="icon" href="icon180.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Учёт">
<title>Колорист · Учёт расходников</title>
<link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="bg"><i></i><i></i><i></i><i></i></div>
    <div class="screen" id="screen"></div>
    <!-- под часами — тот же фон поверх уехавшего вверх списка (см. .bgtop в app.css) -->
    <div class="bgtop" aria-hidden="true"><div class="bg"><i></i><i></i><i></i><i></i></div></div>
    <nav class="tabbar" id="tabbar"></nav>

    <div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()">
      <div class="sheet" id="sheet">
        <div class="grab"></div>
        <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="xbtn" onclick="closeSheet()" aria-label="Закрыть">✕</button></div>
        <div class="sheet-body" id="sheetBody"></div>
        <div class="sheet-foot" id="sheetFoot"></div>
      </div>
    </div>

    <div class="radial" id="radial" onclick="if(event.target===this)закрытьМеню()">
      <div class="wheel" id="wheel"></div>
    </div>

    <div class="confirm-bg" id="confirmBg" onclick="if(event.target===this)closeConfirm()">
      <div class="confirm">
        <div class="confirm-msg" id="confirmMsg"></div>
        <div class="confirm-btns">
          <button class="btn ghost" onclick="closeConfirm()">Отмена</button>
          <button class="btn danger" id="confirmYes" onclick="doConfirm()">Удалить</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <!-- старые формы прячут/показывают кнопки внизу экрана; в этой оболочке их нет -->
    <div id="fabWrap"></div>
  </div>
</div>

<!-- Цеха подключаются по порядку: ядро → экономика → хранилище → распознавание → экраны → оболочка (запуск). -->
<script src="js/core.js"></script>
<script src="js/costing.js"></script>
<script src="js/store.js"></script>
<script src="js/parser.js"></script>
<script src="js/stock.js"></script>
<script src="js/order.js"></script>
<script src="js/services.js"></script>
<script src="js/works.js"></script>
<script src="js/expenses.js"></script>
<script src="js/report.js"></script>
<script src="js/settings.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
