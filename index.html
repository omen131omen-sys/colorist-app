<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#a9857b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon180.png?v=3">
<link rel="apple-touch-icon" href="icon180.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Учёт">
<title>Колорист · Учёт расходников</title>
<style>
  :root{
    /* Палитра «Нюд-мокко» — тёплый бьюти-минимал */
    --bg:#f5f0ec; --card:#fffdfb; --ink:#2a231f; --muted:#93867d;
    --line:#e9e0d8; --brand:#a9857b; --brand-soft:#efe5df;
    --green:#5b8a5b; --green-soft:#e8f0e6; --red:#c46a5f; --red-soft:#f7e6e2;
    --amber:#c08a4a; --amber-soft:#f6ebdb; --blue:#7e8a9c;
    --shadow:0 1px 2px rgba(60,45,35,.05),0 6px 22px rgba(60,45,35,.06);
    --radius:16px;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:"Cormorant Garamond","Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  /* Заставка */
  #splash{position:fixed; inset:0; z-index:200;
    background:radial-gradient(120% 90% at 50% 25%, #faf5f1 0%, #ece0d6 100%);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .55s ease; }
  #splash.hide{opacity:0; pointer-events:none}
  .sp-inner{display:flex; flex-direction:column; align-items:center; gap:16px;
    animation:spRise .8s cubic-bezier(.2,.8,.2,1) both}
  .sp-emblem{width:104px; height:104px; border-radius:50%; background:#fffdfb;
    display:flex; align-items:center; justify-content:center; color:#a9857b;
    box-shadow:0 16px 40px rgba(120,90,70,.20), inset 0 0 0 1px rgba(169,133,123,.14)}
  .sp-emblem svg{width:52px; height:52px}
  .sp-name{font-family:var(--font-display); font-size:44px; font-weight:600;
    color:#2a231f; letter-spacing:.02em; line-height:1}
  .sp-sub{font-size:12px; letter-spacing:.45em; color:#93867d; text-transform:uppercase; padding-left:.45em}
  @keyframes spRise{from{opacity:0; transform:translateY(14px) scale(.97)} to{opacity:1; transform:none}}
  @media(prefers-reduced-motion:reduce){ .sp-inner{animation:none} }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:390px; margin:0 auto; min-height:100vh; background:var(--bg);
    position:relative; padding-bottom:150px;}
  @media(min-width:800px){
    #app{max-width:720px}
  }

  /* Header */
  header.top{position:sticky; top:0; z-index:20; background:rgba(244,244,247,.86);
    backdrop-filter:saturate(180%) blur(12px); padding:14px 16px 10px;
    border-bottom:1px solid var(--line);}
  header.top h1{margin:0; font-family:var(--font-display); font-size:27px; font-weight:600;
    letter-spacing:.01em; display:flex; align-items:center; gap:8px; line-height:1;}
  header.top .gear{position:absolute; top:12px; right:14px; width:38px; height:38px;
    border:1px solid var(--line); background:var(--card); border-radius:11px;
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform .1s}
  header.top .gear:active{transform:scale(.92)}
  header.top .gear svg{width:20px; height:20px; color:var(--muted)}
  header.top .gear.on{background:var(--brand-soft); border-color:var(--brand)}
  header.top .gear.on svg{color:var(--brand)}
  header.top .sub{color:var(--muted); font-size:12.5px; margin-top:2px}

  /* Content */
  main{padding:14px 16px 8px}
  @media(min-width:800px){ .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start} }

  .section-title{font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; color:var(--muted); margin:18px 2px 8px; display:flex;
    justify-content:space-between; align-items:center}
  .section-title:first-child{margin-top:4px}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px; margin-bottom:10px; border:1px solid var(--line)}
  .card.tap{cursor:pointer; transition:transform .06s ease}
  .card.tap:active{transform:scale(.985)}
  .mgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; margin:0 0 4px}
  @media(min-width:800px){ .mgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  .gcard{margin-bottom:0; padding:11px}
  .acc{margin-top:12px}
  .gico{width:34px; height:34px; border-radius:50%; background:var(--brand-soft); color:var(--brand);
    display:inline-flex; align-items:center; justify-content:center; flex:none}
  .gico svg{width:20px; height:20px}
  .sico{display:inline-flex; width:20px; height:20px; color:var(--brand); vertical-align:-3px}
  .sico svg{width:20px; height:20px}
  .icrow{display:flex; flex-wrap:wrap; gap:8px}
  .icpick{width:46px; height:46px; border-radius:12px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); cursor:pointer; display:flex;
    align-items:center; justify-content:center; padding:0}
  .icpick svg{width:24px; height:24px}
  .icpick.on{background:var(--brand-soft); border-color:var(--brand); color:var(--brand)}
  .alerts{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap}
  .alert-chip{flex:1 1 0; min-width:150px; display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:14px; box-shadow:var(--shadow)}
  .alert-chip.tap{cursor:pointer}
  .ac-ic{width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.55);
    display:flex; align-items:center; justify-content:center; flex:none}
  .ac-ic svg{width:18px; height:18px}
  .ac-t{font-weight:700; font-size:13.5px; line-height:1.2}
  .searchbar{display:flex; align-items:center; gap:9px; background:var(--card);
    border:1px solid var(--line); border-radius:13px; padding:0 12px; margin-bottom:12px;
    box-shadow:var(--shadow)}
  .searchbar svg{width:18px; height:18px; color:var(--muted); flex:none}
  .searchbar input{border:none; box-shadow:none; padding:12px 0; background:none; font-size:15px}
  .searchbar input:focus{outline:none}
  .sb-clear{border:none; background:none; color:var(--muted); font-size:16px; cursor:pointer; padding:6px}

  .row{display:flex; align-items:center; gap:10px}
  .row.between{justify-content:space-between}
  .grow{flex:1; min-width:0}
  .ell{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:999px; background:var(--brand-soft); color:var(--brand);
    white-space:nowrap}
  .badge.g{background:var(--green-soft); color:var(--green)}
  .badge.r{background:var(--red-soft); color:var(--red)}
  .badge.a{background:var(--amber-soft); color:var(--amber)}
  .badge.n{background:#eef0f4; color:#5b5966}

  .title{font-family:var(--font-display); font-weight:600; font-size:18px; letter-spacing:.01em}
  .muted{color:var(--muted)}
  .sm{font-size:12.5px}
  .xs{font-size:11.5px}
  .big{font-size:22px; font-weight:800; letter-spacing:-.02em}
  .mono{font-family:var(--font-ui); font-variant-numeric:tabular-nums; font-weight:800; letter-spacing:-.01em}

  /* Progress bar */
  .bar{height:7px; background:#edecf2; border-radius:999px; overflow:hidden; margin-top:9px}
  .bar > i{display:block; height:100%; border-radius:999px; background:var(--brand); transition:width .3s}
  .bar.low > i{background:var(--red)}
  .bar.warn > i{background:var(--amber)}

  /* Buttons */
  button{font-family:inherit}
  .btn{appearance:none; border:none; border-radius:12px; padding:12px 16px; font-size:15px;
    font-weight:700; background:var(--brand); color:#fff; cursor:pointer; width:100%;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:filter .1s, transform .06s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line)}
  .btn.soft{background:var(--brand-soft); color:var(--brand)}
  .btn.danger{background:var(--red-soft); color:var(--red)}
  .btn.sm{padding:9px 12px; font-size:13.5px; width:auto; border-radius:10px}
  .btn.wauto{width:auto}
  .iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;color:var(--muted); flex:none}

  .fab{position:fixed; left:50%; transform:translateX(-50%); bottom:88px; z-index:30;
    width:min(358px,calc(100% - 32px));}
  @media(min-width:800px){ .fab{width:688px} }

  /* Bottom nav */
  nav.tabbar{position:fixed; bottom:0; left:0; right:0; z-index:25;
    background:rgba(255,255,255,.9); backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--line); display:flex; justify-content:center;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
  nav.tabbar .inner{display:flex; width:100%; max-width:390px}
  @media(min-width:800px){ nav.tabbar .inner{max-width:720px} }
  nav.tabbar button{flex:1; background:none; border:none; cursor:pointer; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px;
    font-weight:600; padding:4px 0}
  nav.tabbar button.active{color:var(--brand)}
  nav.tabbar .ico{font-size:21px; line-height:1}
  nav.tabbar .ico svg{width:24px; height:24px; display:block}

  /* Empty */
  .empty{text-align:center; color:var(--muted); padding:40px 20px}
  .empty .em{font-size:40px; margin-bottom:8px}

  /* Sheet / modal */
  .sheet-bg{position:fixed; inset:0; background:rgba(20,18,30,.42); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .22s;
    display:flex; flex-direction:column; justify-content:flex-end}
  .sheet-bg.open{opacity:1; pointer-events:auto}
  @media(min-width:800px){ .sheet-bg{justify-content:center; align-items:center} }
  .sheet{width:100%; max-width:390px; margin:0 auto; background:var(--bg);
    border-radius:22px 22px 0 0; max-height:92vh;
    display:flex; flex-direction:column; overflow:hidden;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .sheet-bg.open .sheet{transform:translateY(0)}
  @media(min-width:800px){ .sheet{max-width:560px; border-radius:22px; max-height:88vh;
    transform:translateY(24px) scale(.98); opacity:0; transition:transform .25s, opacity .25s}
    .sheet-bg.open .sheet{transform:none; opacity:1} }
  .sheet .grab{width:38px;height:5px;border-radius:999px;background:#d7d5de;margin:10px auto 2px}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:8px 16px 10px}
  .sheet-head h2{margin:0; font-size:18px; font-weight:800; letter-spacing:-.01em}
  .sheet-body{flex:1 1 auto; min-height:0; overflow-y:auto; padding:4px 16px 20px; -webkit-overflow-scrolling:touch}
  .sheet-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:var(--card); display:flex; gap:10px}
  .sheet-foot .btn{flex:1}

  /* Form */
  label.fld{display:block; margin-bottom:12px}
  label.fld > span{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:5px}
  input,select,textarea{width:100%; font-family:inherit; font-size:16px; padding:12px;
    border:1px solid var(--line); border-radius:11px; background:var(--card); color:var(--ink);
    -webkit-appearance:none; appearance:none}
  input:focus,select,textarea:focus{outline:2px solid var(--brand-soft); border-color:var(--brand)}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2378767f' stroke-width='2'><path d='M4 6l4 4 4-4'/></svg>");
    background-repeat:no-repeat; background-position:right 12px center; padding-right:34px}
  .fld-row{display:flex; gap:10px}
  .fld-row > *{flex:1}
  label.chk{display:flex; align-items:center; gap:9px; cursor:pointer; -webkit-user-select:none; user-select:none}
  label.chk input[type=checkbox]{width:24px; height:24px; flex:none; margin:0; padding:0; border-radius:7px;
    -webkit-appearance:none; appearance:none; border:1.5px solid var(--line); background:var(--card); position:relative}
  label.chk input[type=checkbox]:checked{background:var(--brand); border-color:var(--brand)}
  label.chk input[type=checkbox]:checked::after{content:''; position:absolute; left:8px; top:3px;
    width:5px; height:11px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg)}
  label.chk > span{font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.2}
  .seg{display:flex; gap:6px; background:#ececf1; padding:4px; border-radius:12px}
  .seg button{flex:1; border:none; background:none; padding:9px 4px; border-radius:9px;
    font-weight:700; font-size:13px; color:var(--muted); cursor:pointer}
  .seg button.on{background:var(--card); color:var(--brand); box-shadow:var(--shadow)}

  .kv{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:700; font-variant-numeric:tabular-nums}

  .step-card{background:var(--card); border:1px solid var(--line); border-radius:13px;
    padding:11px; margin-bottom:9px}
  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#1c1b22; color:#fff; padding:11px 18px; border-radius:12px; font-size:13.5px;
    font-weight:600; z-index:60; opacity:0; transition:.25s; pointer-events:none; box-shadow:var(--shadow)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .confirm-bg{position:fixed; inset:0; background:rgba(20,18,30,.5); z-index:70;
    display:flex; align-items:center; justify-content:center; padding:24px;
    opacity:0; pointer-events:none; transition:opacity .18s}
  .confirm-bg.open{opacity:1; pointer-events:auto}
  .confirm{background:var(--card); border-radius:18px; max-width:330px; width:100%;
    padding:20px; box-shadow:var(--shadow); transform:scale(.96); transition:transform .18s}
  .confirm-bg.open .confirm{transform:scale(1)}
  .confirm-msg{font-size:15px; font-weight:600; line-height:1.4; margin-bottom:18px}
  .confirm-btns{display:flex; gap:10px}
  .confirm-btns .btn{flex:1}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow)}
  .stat .lab{font-size:12px;color:var(--muted);font-weight:600}
  .stat .num{font-family:var(--font-ui);font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat .lab{text-transform:uppercase; letter-spacing:.05em; font-size:10.5px}
  .grid-stat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .mbars{display:flex; align-items:flex-end; gap:7px; height:118px}
  .mbar{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%}
  .mbar-v{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums}
  .mbar-t{flex:1; width:100%; display:flex; align-items:flex-end}
  .mbar-t i{display:block; width:100%; border-radius:6px 6px 0 0; min-height:5px}
  .mbar-l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em}
  .chip{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--brand-soft);
    font-size:12px;font-weight:600;color:var(--brand);margin:0 6px 6px 0}
  .hl{background:var(--brand-soft);color:var(--brand)}
  a.link{color:var(--brand);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-inner">
    <div class="sp-emblem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2s6.4 7.2 6.4 11.4a6.4 6.4 0 0 1-12.8 0c0-4.2 6.4-11.4 6.4-11.4Z"/><path d="M9.4 15a2.7 2.7 0 0 0 2.6 2.4"/></svg></div>
    <div class="sp-name">Учёт</div>
    <div class="sp-sub">колориста</div>
  </div>
</div>
<div id="app">
  <header class="top">
    <button class="gear" id="gearBtn" onclick="go('settings')" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h8M16 7h4"/><circle cx="14" cy="7" r="2.1"/><path d="M4 12h4M12 12h8"/><circle cx="10" cy="12" r="2.1"/><path d="M4 17h8M16 17h4"/><circle cx="14" cy="17" r="2.1"/></svg></button>
    <h1 id="hTitle">Склад</h1>
    <div class="sub" id="hSub">Материалы и остатки</div>
  </header>
  <main id="view"></main>
</div>

<div class="fab" id="fabWrap"></div>

<nav class="tabbar">
  <div class="inner">
    <button data-tab="stock" class="active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.6" width="10" height="3.4" rx="1.4"/><rect x="5.6" y="6" width="12.8" height="15.4" rx="3.2"/><path d="M5.6 12h12.8"/></svg></span>Склад</button>
    <button data-tab="services"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6.6" r="2.6"/><circle cx="6" cy="17.4" r="2.6"/><path d="M8.3 8.1 20 18"/><path d="M8.3 15.9 20 6"/><path d="M12.5 12 15 13.8"/></svg></span>Услуги</button>
    <button data-tab="works"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.6" y="5" width="16.8" height="16" rx="3.2"/><path d="M3.6 9.4h16.8"/><path d="M8 3v3.2M16 3v3.2"/><path d="M7.6 13h4M7.6 16.6h6.4"/></svg></span>Работы</button>
    <button data-tab="expenses"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5a2 2 0 0 1 2-2h10.5a1 1 0 0 1 1 1v1.5"/><rect x="3.5" y="6.5" width="17" height="13" rx="3"/><path d="M15.5 12.2h3.2v3h-3.2a1.5 1.5 0 0 1 0-3Z"/></svg></span>Расход</button>
    <button data-tab="report"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.2h16"/><rect x="5.4" y="12" width="3.3" height="6.2" rx="1.1"/><rect x="10.35" y="8" width="3.3" height="10.2" rx="1.1"/><rect x="15.3" y="4.4" width="3.3" height="13.8" rx="1.1"/></svg></span>Отчёт</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="sheetTitle"></h2>
      <span class="iconbtn" onclick="closeSheet()">✕</span></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="confirm-bg" id="confirmBg" onclick="if(event.target===this)closeConfirm()">
  <div class="confirm">
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="btn ghost" onclick="closeConfirm()">Отмена</button>
      <button class="btn danger" id="confirmYes" onclick="doConfirm()">Удалить</button>
    </div>
  </div>
</div>

<script>
/* ==================== КОНСТАНТЫ ==================== */
const LEN = {plecho:'До плеч', lopatki:'До лопаток', poyasnitsa:'До поясницы'};
const DEN = {tonkie:'Тонкие', srednie:'Средние', gustye:'Густые'};
const LEN_K = Object.keys(LEN), DEN_K = Object.keys(DEN);
const TYPE = {краска:'Краска', оксид:'Оксид / активатор', пудра:'Порошок', смывка:'Смывка', уход:'Уход'};

const AMBER_MARGIN = 45;
function margLevel(marg, price){
  if(marg < 0) return {c:'var(--red)', b:'r', t:'в минус'};
  const p = price ? marg/price*100 : 0;
  if(p < AMBER_MARGIN) return {c:'var(--amber)', b:'a', t:'низкая маржа'};
  return {c:'var(--green)', b:'g', t:''};
}

/* Чистый разбор формулы (без DOM) — используется и в сиде, и в приложении.
   Код оттенка сравнивается ТОЧНО (9.2 ≠ 9.23). Если один код есть в разных
   сериях/брендах (Lumia 6.2 и BB 6.2) — ищем подсказку в тексте («вв», «люмиа»,
   бренд); не нашли — строка помечается неоднозначной с списком кандидатов. */
const _ALIAS={'вв':'bb','бб':'bb','люмиа':'lumia','люмия':'lumia','люми':'lumia','хс':'helen','лонда':'londa','оллин':'ollin','эстель':'estel','эстел':'estel'};
function _matCode(m){ const c=m.название.replace(/(\d),(\d)/g,'$1.$2').match(/(\d{1,2}\.\d{1,2})/); return c?c[1]:null; }
function _matPct(m){ const c=m.название.replace(/(\d),(\d)/g,'$1.$2').match(/(\d+(?:\.\d+)?)\s*%/); return c?c[1]:null; }
function parseFormulaText(text, mats){
  const chunks=(text||'').split(/[+\n;]+/).map(s=>s.trim()).filter(Boolean);
  const lines=[];
  chunks.forEach(ch=>{
    const norm=ch.toLowerCase().replace(/(\d),(\d)/g,'$1.$2');
    let grams=null;
    const gm=norm.match(/(\d+(?:\.\d+)?)\s*(?:гр|г|g|мл|ml)(?![а-яёa-z])/i);
    if(gm) grams=parseFloat(gm[1]);
    // слова-подсказки из строки (серия/бренд), с алиасами кириллицы
    const tokens=(norm.match(/[a-zа-яё]{2,}/g)||[]).filter(t=>!['гр','мл'].includes(t)).map(t=>_ALIAS[t]||t);
    const hay=m=>(m.название+' '+m.бренд).toLowerCase();
    // отбор по словам: побеждают материалы с НАИБОЛЬШИМ числом совпавших слов
    const byTokens=list=>{
      const scored=list.map(m=>({m, n:tokens.filter(t=>hay(m).includes(t)).length})).filter(x=>x.n>0);
      if(!scored.length) return [];
      const max=Math.max(...scored.map(x=>x.n));
      return scored.filter(x=>x.n===max).map(x=>x.m);
    };
    let cand=[];
    const pm=norm.match(/(\d+(?:\.\d+)?)\s*%/);
    if(pm){ cand=mats.filter(m=>m.тип==='оксид' && _matPct(m)===pm[1]); }
    else if(/пудр|блонд|обесцв|порош|осветл/.test(norm)){ cand=mats.filter(m=>m.тип==='пудра'); }
    else if(/бонд|плекс|plex|защит|уход|шампун|кондицион/.test(norm)){ cand=mats.filter(m=>m.тип==='уход'); }
    else {
      // код оттенка — ищем ТОЛЬКО среди красок
      const cm=norm.match(/(\d{1,2}\.\d{1,2})/);
      if(cm) cand=mats.filter(m=>m.тип==='краска' && _matCode(m)===cm[1]);
      // код не нашёлся или его нет, но есть слова — ищем по названию во всех типах (уходы, пудры)
      if(!cand.length && tokens.some(t=>t.length>=3)) cand=byTokens(mats);
    }
    // сужаем по подсказкам («вв 6.2», «лонда 6%», «би хеир»)
    if(cand.length>1 && tokens.length){
      const hit=byTokens(cand);
      if(hit.length>=1) cand=hit;
    }
    let bn=null;
    if(grams==null){ bn=norm.match(/(\d+(?:\.\d+)?)\s*$/); if(bn) grams=parseFloat(bn[1]); }
    // «шаг 1» vs «шаг 2»: голые цифры строки (кроме граммов/%/кода оттенка) дожимают выбор
    if(cand.length>1){
      let rest=norm;
      [gm&&gm[0], pm&&pm[0], bn&&bn[0]].forEach(s=>{ if(s) rest=rest.replace(s,' '); });
      rest=rest.replace(/\d{1,2}\.\d{1,2}/g,' ');
      const digs=(rest.match(/\d{1,2}/g)||[]);
      if(digs.length){
        const hit=cand.filter(m=>digs.every(d=>new RegExp('(^|[^0-9.,])'+d+'([^0-9.,]|$)').test(m.название.toLowerCase())));
        if(hit.length>=1) cand=hit;
      }
    }
    if(grams!=null || cand.length){
      lines.push({материал_id:cand.length===1?cand[0].id:null, граммы:grams||0, raw:ch,
        кандидаты:cand.length>1?cand.map(m=>m.id):null});
    }
  });
  return lines;
}

/* стоимость работы по её шагам (без списания склада) */
function calcCost(w, materials){
  const mp = Object.fromEntries(materials.map(m=>[m.id,m]));
  let c = 0;
  (w.шаги||[]).forEach(s=>{
    const m = mp[s.материал_id]; const ox = mp[s.оксид_id];
    if(m) c += (s.факт_граммы||0)*gpr(m);
    if(ox) c += (s.факт_оксида||0)*gpr(ox);
  });
  (w.штучные||[]).forEach(p=> c += (p.кол_во||0)*(p.цена_за_штуку||0));
  return Math.round(c);
}

const KEY = 'colorist_v7';
let DB;
function load(){
  try{ DB = JSON.parse(localStorage.getItem(KEY)); }catch(e){ DB=null; }
  if(!DB || !DB.materials){ DB = seed(); save(); }
  if(!DB.purchases) DB.purchases=[];
  // Единый журнал расходов + список оборудования
  if(!DB.expenses){
    DB.expenses = (DB.purchases||[]).map(b=>({id:b.id||uid('e'), дата:b.дата, категория:'материалы',
      сумма:b.сумма||0, заметка:(b.название||'Закупка')+(b.кол?' · '+b.кол:''), материал_id:b.материал_id||null}));
  }
  if(!DB.equipment) DB.equipment=[];
  // «Еда» была отдельной категорией не с самого начала — переносим то, что писали в «прочее».
  (DB.expenses||[]).forEach(e=>{
    if(e.категория==='прочее' && /^\s*(еда|обед|перекус|продукт\w*)\s*$/i.test(e.заметка||'')) e.категория='еда';
  });
  // Услуги стали прайс-листом: одна «цена» → вилка «от–до», типовой рецепт больше не хранится.
  (DB.services||[]).forEach(s=>{
    if(s.цена_от==null){ s.цена_от=s.цена||0; s.цена_до=0; }
    delete s.цена; delete s.формула;
  });
}
function save(){ DB._updatedAt=Date.now(); localStorage.setItem(KEY, JSON.stringify(DB)); scheduleSync(); }
function mById(id){ return DB.materials.find(m=>m.id===id); }
function pById(id){ return DB.pieces.find(p=>p.id===id); }

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <input id="stockSearch" placeholder="Найти оттенок, бренд…" value="${esc(_stockQuery)}" oninput="onStockSearch(this)">
    <button class="sb-clear" id="sbClear" onclick="clearStockSearch()" style="${_stockQuery?'':'display:none'}">✕</button>
  </div>`;
  return searchBox + `<div id="stockBody">${renderStockBody()}</div>`;
}
function renderStockBody(){
  const q=_stockQuery.trim().toLowerCase();
  if(q){
    const mm=DB.materials.filter(m=>(m.название+' '+m.бренд+' '+TYPE[m.тип]).toLowerCase().includes(q));
    if(!mm.length) return `<div class="empty"><div class="em">🔍</div><div class="sm">Ничего не найдено по «${esc(_stockQuery)}»</div></div>`;
    return `<div class="sm muted" style="margin:2px 2px 8px">Найдено: ${mm.length}</div><div class="mgrid">${mm.map(matCardHtml).join('')}</div>`;
  }
  const low = DB.materials.filter(m=>m.остаток_г<=m.мин_остаток_г).length;
  let h = '';
  // Компактные уведомления в один ряд.
  const alerts=[];
  if(low>0) alerts.push(alertChip('r', ICN_ALERT, `${low} на исходе`, 'открыть список', "orderSheet()"));
  // Резервное копирование живёт в Настройках — на Складе не мозолит.
  if(alerts.length) h += `<div class="alerts">${alerts.join('')}</div>`;
  const groups = [
    {k:'краска', ic:'🎨', title:'Краска'},
    {k:'оксид', ic:'🧪', title:'Оксид / активатор'},
    {k:'пудра', ic:'✨', title:'Порошок'},
    {k:'смывка', ic:'🧴', title:'Смывка'},
    {k:'уход', ic:'💆', title:'Уход'},
  ];
  groups.forEach(g=>{
    const items = DB.materials.filter(m=>m.тип===g.k);
    if(!items.length) return;
    const lowN = items.filter(m=>m.остаток_г<=m.мин_остаток_г).length;
    const open = !!_stockOpen[g.k];
    h += accHeader(g.k, g.ic, g.title, items.length, lowN, open);
    if(open) h += `<div class="mgrid">` + items.map(matCardHtml).join('') + `</div>`;
  });
  return h;
}

function orderList(){
  return DB.materials.filter(m=>m.остаток_г<=m.мин_остаток_г)
    .map(m=>({название:m.название, бренд:m.бренд, текст:`осталось ${fmtG(m.остаток_г)} г (мин ${m.мин_остаток_г})`}));
}
function orderSheet(){
  const list=orderList();
  if(!list.length) return toast('Всё в норме — заказывать нечего ✅');
  const rows=list.map(x=>`<div class="kv"><span class="k">${esc(x.название)}${x.бренд&&x.бренд!=='—'?' · '+esc(x.бренд):''}</span><span class="v" style="color:var(--red)">${esc(x.текст)}</span></div>`).join('');
  openSheet('Заказать', `
    <div class="sm muted" style="margin-bottom:10px">${list.length} ${plural(list.length,'позиция','позиции','позиций')} на исходе. Скопируй список и отправь поставщику.</div>
    <div class="card">${rows}</div>`,
    [`<button class="btn ghost" onclick="closeSheet()">Закрыть</button>`,
     `<button class="btn" onclick="copyOrder()">📋 Скопировать список</button>`]);
}
function copyOrder(){
  const list=orderList();
  const t='Заказать:\n'+list.map(x=>'• '+x.название+(x.бренд&&x.бренд!=='—'?' ('+x.бренд+')':'')+' — '+x.текст).join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast('Список скопирован'),()=>fallbackCopy(t));
  else fallbackCopy(t);
}

function doRestockMat(id){
  const m=mById(id);
  const g=+document.getElementById('rg').value||0;
  const packs=+document.getElementById('rq').value||0;
  if(g>0){ // корректировка граммами, без денег
    m.остаток_г += g; save(); closeSheet(); go('stock'); return toast('Приход +'+fmtG(g)+' г (без покупки)');
  }
  if(packs<=0) return toast('Укажите количество упаковок');
  const сумма=+document.getElementById('rs').value||0;
  const add = packs*m.нетто_г;
  m.остаток_г += add;
  // цена изменилась → запоминаем новую цену упаковки (себестоимость дальше по ней)
  const newPack = сумма/packs;
  if(сумма>0 && Math.abs(newPack-m.цена_упаковки)>=1) m.цена_упаковки = Math.round(newPack);
  logPurchase({материал_id:m.id, название:m.название, кол:packs+' уп.', граммы:add, сумма});
  save(); closeSheet(); go('stock');
  toast('Приход +'+fmtG(add)+' г · закупка '+money(сумма));
}

function doRestockPiece(id){
  const p=pById(id); const q=+document.getElementById('rq').value||0;
  if(q<=0) return toast('Укажите количество');
  const сумма=+document.getElementById('rs').value||0;
  p.остаток_шт += q;
  const newPer = сумма/q;
  if(сумма>0 && Math.abs(newPer-p.цена_за_штуку)>=0.5) p.цена_за_штуку = Math.round(newPer*10)/10;
  logPurchase({материал_id:p.id, название:p.название, кол:q+' шт', граммы:0, сумма});
  save(); closeSheet(); go('stock'); toast('Приход +'+q+' шт · закупка '+money(сумма));
}
function logPurchase(o){

/* На этикетке пишут мл, работаем в граммах. Плотность НЕ равна 1:
   замер по тюбику краски — 108 г брутто − 15 г тара = 93 г на заявленные 100 мл (0.93).
   Подставляем прикидку по типу; если взвесила — вписывает своё, оно в приоритете. */
const DENSITY={краска:0.93, оксид:1.05, смывка:1, уход:1, пудра:1};
function autoNet(el){
  const net=document.getElementById('f_net'); if(!net) return;
  if(net.value && net.dataset.auto!=='1') return;   // введённое вручную не трогаем
  const t=(document.getElementById('f_type')||{}).value||'краска';
  const ml=+el.value||0;
  net.value = ml ? Math.round(ml*(DENSITY[t]||1)) : '';
  net.dataset.auto='1';
}
function saveMaterialW(id){
  const g=x=>document.getElementById(x).value;
  const name=g('f_name').trim(); if(!name) return toast('Введите название');
  const obj={ бренд:g('f_brand').trim()||'—', название:name, тип:g('f_type'),
    объём_мл:+g('f_ml')||0, тара_г:+g('f_tare')||0,
    нетто_г:+g('f_net')||1, цена_упаковки:+g('f_price')||0,
    остаток_г:+g('f_rest')||0, мин_остаток_г:+g('f_min')||0 };

/* Услуга — строка прайс-листа: {название, иконка, цена_от, цена_до, время_мин}.
   Рецепт тут не хранится: формула у каждого клиента своя, её вставляют при расчёте работы.
   svcFrom/svcTo понимают и старый формат (одно поле «цена»). */
function svcFrom(s){ return s.цена_от!=null ? (s.цена_от||0) : (s.цена||0); }
function svcTo(s){ return s.цена_до ? s.цена_до : svcFrom(s); }
function svcPriceText(s){
  const a=svcFrom(s), b=svcTo(s);
  return b>a ? money(a)+' – '+money(b) : money(a);
}
function svcTimeTo(s){ return s.время_до ? s.время_до : (s.время_мин||0); }
function fmtHrs(min){
  if(!min) return '—';
  if(min<60) return min+' мин';
  const h=min/60;
  return (Math.round(h*10)/10).toLocaleString('ru-RU')+' ч';
}
function svcTimeText(s){
  const a=s.время_мин||0, b=svcTimeTo(s);
  if(!a) return '—';
  return b>a ? fmtHrs(a)+' – '+fmtHrs(b) : fmtHrs(a);
}
/* Факт по услуге из журнала работ — прайс показывает реальные цифры, а не гипотетические. */
function svcStats(s){
  const ws=DB.works.filter(w=>w.услуга_id===s.id);
  if(!ws.length) return null;
  const rev=ws.reduce((x,w)=>x+(w.цена||0),0);
  const cost=ws.reduce((x,w)=>x+(w.себестоимость||0),0);
  return {n:ws.length, rev, cost, avg:Math.round(rev/ws.length),
          marg:rev-cost, margPct:rev?Math.round((rev-cost)/rev*100):0,
          min:Math.min(...ws.map(w=>w.цена||0)), max:Math.max(...ws.map(w=>w.цена||0))};
}
function renderServices(){
  let h='<div class="sm muted" style="margin:2px 2px 10px">Прайс-лист. Цены ориентировочные — точную сумму вписываешь при проведении работы.</div>';
  if(!DB.services.length) h += emptyBox('✂️','Нет услуг','Добавьте первую услугу');
  DB.services.forEach(s=>{
    const st=svcStats(s);
    const sub = st ? `${st.n} ${plural(st.n,'работа','работы','работ')} · ср. чек ${money(st.avg)}`
                   : (s.время_мин?svcTimeText(s):'ещё не проводилась');
    h += `<div class="card tap" onclick="svcSheet('${s.id}')">
      <div class="row between">
        <div class="row grow" style="gap:11px; min-width:0">
          ${svcCircle(s)}
          <div class="grow" style="min-width:0">
            <div class="title ell">${esc(s.название)}</div>
            <div class="sm muted ell" style="margin-top:2px">${sub}</div>
          </div>
        </div>
        <div style="text-align:right; flex:none; padding-left:8px">
          <div class="title mono" style="white-space:nowrap">${svcPriceText(s)}</div>
          ${st?`<div class="xs" style="color:${margLevel(st.marg,st.rev).c}">маржа ${st.margPct}%</div>`
              :(s.время_мин?'':`<div class="xs muted">${s.время_мин||0} мин</div>`)}
        </div>
      </div>
    </div>`;
  });
  return h;
}

  openSheet(esc(s.название), `
    <div class="card">

/* ==================== РАБОТЫ (журнал по дням) ==================== */
let _wPeriod='month';
const W_PERIODS=[['today','Сегодня'],['week','Неделя'],['month','Месяц'],['all','Всё']];
function periodFrom(p){
  const d=new Date(); d.setHours(0,0,0,0);
  if(p==='today') return d.toISOString().slice(0,10);
  if(p==='week'){ d.setDate(d.getDate()-6); return d.toISOString().slice(0,10); }
  if(p==='month'){ d.setDate(d.getDate()-29); return d.toISOString().slice(0,10); }
  return '0000-00-00';
}
function setWPeriod(p){ _wPeriod=p; document.getElementById('view').innerHTML=renderWorks(); }
function renderWorks(){
  const all=[...DB.works].sort((a,b)=>b.дата.localeCompare(a.дата));
  const seg=`<div class="seg" style="margin-bottom:12px">${W_PERIODS.map(([k,l])=>
    `<button class="${_wPeriod===k?'on':''}" onclick="setWPeriod('${k}')">${l}</button>`).join('')}</div>`;

  if(!all.length) return seg+emptyBox('📋','Пока нет работ','Кнопка «＋ Работа» внизу. Если услуг ещё нет — сначала заведите услугу');

  const from=periodFrom(_wPeriod);
  const works=all.filter(w=>w.дата>=from);

  // сводка за период
  const rev=works.reduce((s,w)=>s+w.цена,0);
  const cost=works.reduce((s,w)=>s+w.себестоимость,0);
  const marg=rev-cost;
  let h=seg;
  h+=`<div class="grid-stat" style="margin-bottom:4px">
    <div class="stat"><div class="lab">Выручка</div><div class="num mono">${money(rev)}</div></div>
    <div class="stat"><div class="lab">Маржа</div><div class="num mono" style="color:var(--green)">${money(marg)}</div></div>
  </div>
  <div class="card" style="margin-bottom:6px"><div class="row between">
    <span class="muted sm">${works.length} ${plural(works.length,'работа','работы','работ')}${works.length?' · ср. чек '+money(rev/works.length):''}</span>
    <span class="sm muted">себест. ${money(cost)}</span>
  </div></div>`;

  if(!works.length) return h+`<div class="empty"><div class="em">🗓️</div><div class="sm">За этот период работ нет</div></div>`;

  // группировка по дням
  const byDay={};
  works.forEach(w=>{ (byDay[w.дата]=byDay[w.дата]||[]).push(w); });
  Object.keys(byDay).sort((a,b)=>b.localeCompare(a)).forEach(day=>{
    const list=byDay[day];
    const dRev=list.reduce((s,w)=>s+w.цена,0);
    h+=`<div class="section-title"><span>${fmtDateFull(day)}</span>
      <span class="muted mono">${list.length} · ${money(dRev)}</span></div>`;
    list.forEach(w=>{
      const svc=sById(w.услуга_id);
      h+=`<div class="card tap" onclick="workSheet('${w.id}')">
        <div class="row between">
          <div class="grow">
            <div class="title ell">${svcInline(svc)} ${esc(w.услуга_назв)}${w.без_склада?' <span class="badge a" style="padding:1px 6px;font-size:10px">задн. числом</span>':''}</div>
            <div class="sm muted ell">${w.формула?esc(w.формула.split('\n')[0]):'без формулы'}</div>
          </div>
          <div class="row" style="gap:10px">
            <div style="text-align:right">
              <div class="title mono">${money(w.цена)}</div>
              <div class="xs" style="color:${margLevel(w.маржа,w.цена).c}">${w.маржа<0?'':'+'}${money(w.маржа)}${w.маржа<0?' 🔴':''}</div>
            </div>
            <span class="iconbtn" onclick="event.stopPropagation();delWork('${w.id}')">🗑</span>
          </div>
        </div>
      </div>`;
    });
  });
  return h;
}
function workSheet(id){
  const w=DB.works.find(x=>x.id===id);
  let steps=w.шаги.map(s=>{
    const m=mById(s.материал_id), ox=s.оксид_id?mById(s.оксид_id):null;

      <div class="kv"><span class="k">Цена</span><span class="v">${money(w.цена)}</span></div>
      <div class="kv"><span class="k">Маржа</span><span class="v" style="color:var(--green)">${money(w.маржа)} · ${w.цена?Math.round(w.маржа/w.цена*100):0}%</span></div>
    </div>
    <button class="btn soft" onclick="copyRecipe('${id}')">📋 Скопировать рецепт для DIKIDI</button>`,
    [`<button class="btn danger wauto" onclick="delWork('${id}')">🗑</button>`,
     `<button class="btn ghost" onclick="editWork('${id}')">✏️ Изменить</button>`]);
}
function editWork(id){
  const w=DB.works.find(x=>x.id===id); if(!w) return;
  const orig={};
  // Для работ, списанных со склада, помним прежние граммы — чтобы availFor не считал их дефицитом при правке.
  if(!w.без_склада) (w.шаги||[]).forEach(s=>{ orig[s.материал_id]=(orig[s.материал_id]||0)+s.факт_граммы; });
  _nw={услуга_id:w.услуга_id,
    lines:(w.шаги||[]).map(s=>({материал_id:s.материал_id, граммы:s.факт_граммы})),
    штучные:(w.штучные||[]).map(p=>({id:p.id, кол_во:p.кол_во})),
    остаток:w.остаток_смеси_г||0, формула:w.формула||'', цена:w.цена||0, время:w.время||(sById(w.услуга_id)||{}).время_мин||0,
    _editId:id, _date:w.дата, _noStock:!!w.без_склада, _origByMat:orig};
  drawNewWork();
}
function availFor(mid){ const m=mById(mid); if(!m) return 0; return m.остаток_г + (_nw&&_nw._origByMat?(_nw._origByMat[mid]||0):0); }
function recipeText(w){
  const parts=(w.шаги||[]).map(s=>{
    const m=mById(s.материал_id); let t=(m?m.название:'?')+' — '+s.факт_граммы+' г';
    if(s.оксид_id){ const ox=mById(s.оксид_id); t+=' + '+(ox?ox.название:'оксид')+' — '+s.факт_оксида+' г'; }
    return t;
  });
  let r=parts.join('\n');
  if(w.остаток_смеси_г) r+='\nОстаток смеси: '+w.остаток_смеси_г+' г';
  return r;
}
function copyRecipe(id){
  const w=DB.works.find(x=>x.id===id); const t=recipeText(w);
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast('Рецепт скопирован'),()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Рецепт скопирован'); }catch(e){ toast('Скопируйте вручную'); }
  document.body.removeChild(ta);
}
function delWork(id){
  const wch=DB.works.find(x=>x.id===id);
  const msg=(wch&&wch.без_склада)?'Удалить работу? (склад не затрагивается)':'Удалить работу? Списанные материалы вернутся на склад.';
  confirmDo(msg, ()=>{
    const w=DB.works.find(x=>x.id===id);
    // возврат на склад — только если работа реально списывалась
    if(w && !w.без_склада){
      (w.шаги||[]).forEach(s=>{ const m=mById(s.материал_id); if(m)m.остаток_г+=s.факт_граммы;
        const ox=mById(s.оксид_id); if(ox)ox.остаток_г+=s.факт_оксида; });
      (w.штучные||[]).forEach(p=>{ const pp=pById(p.id); if(pp)pp.остаток_шт+=p.кол_во; });
    }
    DB.works=DB.works.filter(x=>x.id!==id); save(); closeSheet(); go('works'); toast((w&&w.без_склада)?'Удалено':'Удалено, склад пополнен');
  });
}

/* Мастер расчёта новой работы. Строка расхода = {материал_id, граммы}. */
let _nw=null;
function matName(id){ const m=mById(id); return m?m.название:'—'; }
function newWork(svcId){
  if(!DB.services.length) return toast('Сначала добавьте услугу');
  _nw={услуга_id:svcId||DB.services[0].id, lines:[], штучные:[], остаток:0, формула:'',
       _date:new Date().toISOString().slice(0,10), _noStock:false};

  drawNewWork();
}
/* Услуга даёт только ориентир по цене и времени — рецепт вставляют из DIKIDI под клиента. */
function loadNwLines(){
  const s=sById(_nw.услуга_id);
  _nw.цена = svcFrom(s);
  _nw.время = s.время_мин||0;
}
/* Разбор вставленной формулы в строки расхода. */
function parseFormula(){
  const el=document.getElementById('nw_formula');
  if(el) _nw.формула=el.value;
  const text=(_nw.формула||'').trim();
  if(!text) return toast('Вставьте формулу');
  const lines=parseFormulaText(text, DB.materials);
  if(!lines.length) return toast('Не удалось распознать формулу');
  _nw.lines=lines; drawNewWork();
  const bad=lines.filter(l=>!l.материал_id).length;
  toast(bad? `Распознано, уточните ${bad} ${plural(bad,'строку','строки','строк')}` : 'Формула распознана ✓');
}
function drawNewWork(){
  const lineOpt=(id,candIds)=>{
    let h='';
    if(candIds&&candIds.length){
      h+=candIds.map(cid=>{const c=mById(cid); return c?`<option value="${c.id}">${esc(c.название)} (${esc(c.бренд)})</option>`:'';}).join('');
      h+=`<option value="" disabled>──────────</option>`;
    }
    h+=DB.materials.map(m=>`<option value="${m.id}" ${m.id===id?'selected':''}>${esc(m.название)}</option>`).join('');
    return h;
  };
  const linesHtml=_nw.lines.map((ln,i)=>{
    const m=mById(ln.материал_id);
    const warn=!_nw._noStock && m && ln.граммы>availFor(ln.материал_id);
    const amb=!ln.материал_id && ln.кандидаты && ln.кандидаты.length;
    const bad=!ln.материал_id && !amb;
    const style = amb ? 'border-color:#f2ddb0;background:var(--amber-soft)'
                : bad ? 'border-color:#f3bcbc;background:var(--red-soft)' : '';
    const label = amb ? '<span style="color:var(--amber)">найдено несколько — выберите серию</span>'
                : bad ? '<span style="color:var(--red)">не распознано — выберите</span>'
                : (m?TYPE[m.тип]:'Материал');
    return `<div class="step-card" style="${style}">
      <div class="fld-row" style="gap:8px;align-items:flex-end">
        <label class="fld" style="margin-bottom:0;flex:2">
          <span>${label}</span>
          <select onchange="_nw.lines[${i}].материал_id=this.value||null;_nw.lines[${i}].кандидаты=null;drawNewWork()">
            <option value="">— выбрать —</option>${lineOpt(ln.материал_id, amb?ln.кандидаты:null)}
          </select></label>
        <label class="fld" style="margin-bottom:0;flex:1">
          <span>Грамм ${warn?'<span style="color:var(--red)">!</span>':''}</span>
          <input type="number" inputmode="numeric" value="${ln.граммы}" onchange="_nw.lines[${i}].граммы=+this.value;recalcNw()"></label>
        <span class="iconbtn" style="margin-bottom:2px" onclick="_nw.lines.splice(${i},1);drawNewWork()">✕</span>
      </div>
      ${amb?`<div class="xs" style="margin-top:6px;color:var(--amber)">«${esc(ln.raw||'')}»: ${ln.кандидаты.map(cid=>{const c=mById(cid);return c?esc(c.название):'';}).filter(Boolean).join(' / ')}</div>`:''}
      ${bad&&ln.raw?`<div class="xs muted" style="margin-top:6px">Из формулы: «${esc(ln.raw)}»</div>`:''}
      ${warn?`<div class="xs" style="margin-top:6px;color:var(--red)">⚠ не хватает ${fmtG(ln.граммы-availFor(ln.материал_id))} г (доступно ${fmtG(availFor(ln.материал_id))} г) — остаток уйдёт в 0, позиция «пора заказать»</div>`
        :(m?`<div class="xs muted" style="margin-top:6px">Остаток ${fmtG(m.остаток_г)} г · ${money1(gpr(m))}/г · строка ${money(ln.граммы*gpr(m))}</div>`:'')}
    </div>`;
  }).join('');

  openSheet(_nw._editId?'Изменить работу':'Расчёт работы', `
    <label class="fld"><span>Услуга (для цены и статистики)</span>
      <select onchange="_nw.услуга_id=this.value;loadNwLines();drawNewWork()">
        ${DB.services.map(x=>`<option value="${x.id}" ${x.id===_nw.услуга_id?'selected':''}>${esc(x.название)}</option>`).join('')}
      </select></label>

    <div class="fld-row" style="align-items:flex-end">
      <label class="fld" style="flex:1"><span>Дата работы</span>
        <input type="date" value="${_nw._date||''}" onchange="_nw._date=this.value"></label>
      <label class="chk" style="flex:1;margin-bottom:12px" onclick="event.stopPropagation()">
        <input type="checkbox" ${_nw._noStock?'checked':''} onchange="_nw._noStock=this.checked;drawNewWork()">
        <span>Задним числом<br><span class="xs muted">не списывать склад</span></span>
      </label>
    </div>
    ${_nw._noStock?`<div class="sm" style="color:var(--brand);margin:-4px 2px 10px">📌 Прошлая работа: остатки склада не трогаем. Строки расхода можно не заполнять — себестоимость посчитается по тем, что укажешь (иначе 0).</div>`:''}

    <div class="card" style="background:var(--brand-soft);border-color:#e0d6ff">
      <div class="xs" style="color:var(--brand);font-weight:700;margin-bottom:6px">ФОРМУЛА ИЗ DIKIDI</div>
      <textarea id="nw_formula" rows="2" placeholder="10.2 (20гр) + 9.23 (5гр) + 1,5% (60гр)" style="resize:vertical" onchange="_nw.формула=this.value">${esc(_nw.формула||'')}</textarea>
      <button class="btn sm" style="margin-top:8px" onclick="parseFormula()">🔎 Разобрать формулу</button>
    </div>

    <div class="section-title"><span>Сверка расхода</span><span class="link" onclick="_nw.lines.push({материал_id:null,граммы:0});drawNewWork()">＋ строка</span></div>
    ${linesHtml||'<div class="sm muted" style="margin-bottom:10px">Вставьте формулу или добавьте строки вручную</div>'}
    <label class="fld"><span>Остаток смеси (в отход), г</span>
      <input type="number" inputmode="numeric" value="${_nw.остаток}" onchange="_nw.остаток=+this.value"></label>

    <label class="fld" style="margin-top:12px"><span>Сколько взяла с клиента, ₽${(()=>{const s=sById(_nw.услуга_id);return s&&svcTo(s)>svcFrom(s)?` <span class="xs muted">(по прайсу ${svcPriceText(s)})</span>`:'';})()}</span>
      <input id="nw_price" type="number" inputmode="numeric" value="${_nw.цена}" onchange="_nw.цена=+this.value;recalcNw()"></label>
    <label class="fld"><span>Время работы, мин (для «доход/час»)</span>
      <input type="number" inputmode="numeric" value="${_nw.время||''}" placeholder="90" onchange="_nw.время=+this.value"></label>
    <div class="card" id="nw_summary"></div>
  `, [`<button class="btn ghost" onclick="closeSheet()">Отмена</button>`,
      `<button class="btn" onclick="saveWork()">💾 ${_nw._editId?'Сохранить':(_nw._noStock?'Добавить работу':'Провести работу')}</button>`]);
  recalcNw();
}
function addNwPiece(id){
  if(_nw.штучные.find(x=>x.id===id)) return;
  _nw.штучные.push({id, кол_во:1}); drawNewWork();
}
function nwCost(){
  const шаги=_nw.lines.filter(l=>l.материал_id).map(l=>({материал_id:l.материал_id, факт_граммы:l.граммы, факт_оксида:0}));
  const штучные=_nw.штучные.map(p=>{const pp=pById(p.id);return {...p, цена_за_штуку:pp?pp.цена_за_штуку:0};});
  return calcCost({шаги, штучные}, DB.materials);
}
function recalcNw(){
  const cost=nwCost();
  const price=_nw.цена||0; const marg=price-cost;
  const lvl=margLevel(marg, price);
  const el=document.getElementById('nw_summary'); if(!el)return;
  const short=_nw._noStock?0:_nw.lines.filter(l=>{const m=mById(l.материал_id); return m && l.граммы>availFor(l.материал_id);}).length;
  el.innerHTML=`
    <div class="kv"><span class="k">Себестоимость</span><span class="v">${money(cost)}</span></div>
    <div class="kv"><span class="k">Цена (доход)</span><span class="v">${money(price)}</span></div>
    <div class="kv"><span class="k">Маржа</span><span class="v" style="color:${lvl.c}">${money(marg)} · ${price?Math.round(marg/price*100):0}%${lvl.t?' · '+lvl.t:''}</span></div>
    ${lvl.b==='r'?`<div class="sm" style="color:var(--red);margin-top:8px;font-weight:700">🔴 Работа в минус: цена ниже себестоимости на ${money(-marg)}</div>`
      :lvl.b==='a'?`<div class="sm" style="color:var(--amber);margin-top:8px">🟡 Низкая маржа — материалы съедают ${price?Math.round(cost/price*100):0}% цены</div>`:''}
    ${short?`<div class="sm" style="color:var(--red);margin-top:6px">⚠ ${short} ${plural(short,'позиции','позиций','позиций')} не хватает на складе — проведётся, остаток уйдёт в 0</div>`:''}`;
}
function saveWork(){
  const s=sById(_nw.услуга_id);
  const noStock=!!_nw._noStock;
  const bad=_nw.lines.filter(l=>!l.материал_id).length;
  const шаги=_nw.lines.filter(l=>l.материал_id).map(l=>({название:matName(l.материал_id), материал_id:l.материал_id, факт_граммы:l.граммы, оксид_id:null, факт_оксида:0}));
  // При обычном проведении нужна хотя бы одна строка; задним числом — можно без формулы (себестоимость 0).
  if(!noStock && !шаги.length) return toast('Добавьте хотя бы одну строку расхода');
  const штучные=_nw.штучные.map(p=>{const pp=pById(p.id);return {id:p.id, название:pp?pp.название:'?', кол_во:p.кол_во, цена_за_штуку:pp?pp.цена_за_штуку:0};});
  // Режим редактирования: возвращаем на склад старую работу (только если она списывалась), потом списываем новую
  if(_nw._editId){
    const orig=DB.works.find(x=>x.id===_nw._editId);
    if(orig){
      if(!orig.без_склада){
        (orig.шаги||[]).forEach(st=>{ const m=mById(st.материал_id); if(m)m.остаток_г+=st.факт_граммы; });
        (orig.штучные||[]).forEach(p=>{ const pp=pById(p.id); if(pp)pp.остаток_шт+=p.кол_во; });
      }
      DB.works=DB.works.filter(x=>x.id!==_nw._editId);
    }
  }
  const today=new Date().toISOString().slice(0,10);
  const w={ id:_nw._editId||uid('w'), дата:_nw._date||today, услуга_id:s.id, услуга_назв:s.название,
    шаги, остаток_смеси_г:_nw.остаток||0, время:_nw.время||0,
    штучные, цена:_nw.цена||0, формула:_nw.формула||'', без_склада:noStock };
  w.себестоимость=calcCost({шаги, штучные}, DB.materials);
  w.маржа=w.цена-w.себестоимость;
  let zeroed=0;
  if(!noStock){
    шаги.forEach(st=>{ const m=mById(st.материал_id); if(m){ if(st.факт_граммы>m.остаток_г) zeroed++; m.остаток_г=Math.max(0,m.остаток_г-st.факт_граммы); } });
    штучные.forEach(p=>{ const pp=pById(p.id); if(pp)pp.остаток_шт=Math.max(0,pp.остаток_шт-p.кол_во); });
  }
  const wasEdit=!!_nw._editId;
  DB.works.push(w); save(); closeSheet(); go('works');
  const notes=[];
  if(bad) notes.push(`${bad} нераспозн. строк пропущено`);
  if(zeroed) notes.push(`${zeroed} позиц. в 0`);
  if(w.маржа<0) notes.push('⚠ в минус');
  const base = wasEdit ? 'Работа изменена' : (noStock ? 'Работа добавлена (задним числом)' : 'Работа проведена');
  const tail = notes.length ? ' · '+notes.join(' · ') : (noStock ? '' : ', склад обновлён');
  toast(base + tail);
}

/* ==================== РАСХОД ==================== */
// «материалы» приходят ТОЛЬКО со склада (Приход) — в ручной ввод не даём, чтобы не путаться.
const EXP_CATS={материалы:'Материалы', расходники:'Расходники', косметика:'Косметика/уход', мелочь:'Мелочь/сервис', еда:'Еда', такси:'Такси', аренда:'Аренда', реклама:'Реклама', обучение:'Обучение', прочее:'Прочее'};
const EXP_MANUAL_CATS=['расходники','косметика','мелочь','еда','такси','аренда','реклама','обучение','прочее'];
const EXP_CAT_KEYS=Object.keys(EXP_CATS);
let _expPeriod='month';
function setExpPeriod(p){ _expPeriod=p; document.getElementById('view').innerHTML=renderExpenses(); }
function expInPeriod(p){ const from=periodFrom(p); return (DB.expenses||[]).filter(e=>e.дата>=from); }
function equipTotal(){ return (DB.equipment||[]).reduce((s,e)=>s+(e.цена||0)*(e.кол_во||1),0); }
function renderExpenses(){
  const seg=`<div class="seg" style="margin-bottom:12px">${W_PERIODS.map(([k,l])=>
    `<button class="${_expPeriod===k?'on':''}" onclick="setExpPeriod('${k}')">${l}</button>`).join('')}</div>`;
  const list=expInPeriod(_expPeriod).sort((a,b)=>b.дата.localeCompare(a.дата));
  const total=list.reduce((s,e)=>s+(e.сумма||0),0);
  const byCat={}; list.forEach(e=>byCat[e.категория]=(byCat[e.категория]||0)+(e.сумма||0));
  let h=seg;
  h+=`<div class="stat" style="margin-bottom:6px"><div class="lab">Расход за период</div><div class="num mono">${money(total)}</div></div>`;
  const catChips=EXP_CAT_KEYS.filter(k=>byCat[k]).map(k=>`<span class="chip">${EXP_CATS[k]}: ${money(byCat[k])}</span>`).join('');
  if(catChips) h+=`<div style="margin:2px 0 10px">${catChips}</div>`;
  h+=`<div class="sm muted" style="margin:2px 2px 10px">💡 Краски, оксиды, порошок, смывка, маски — через «Приход» на Складе. Здесь — расходники (перчатки, фольга, шапочки), косметика (шампуни, укладочные, термозащита), еда, такси, аренда и прочее.</div>`;
  // Оборудование
  h+=`<div class="card tap" onclick="equipSheet()" style="display:flex;align-items:center;gap:11px">
    <span class="gico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a3.7 3.7 0 0 0-5 5l-6 6 2 2 6-6a3.7 3.7 0 0 0 5-5l-2.2 2.2-2-2Z"/></svg></span>
    <div class="grow"><div class="title">Оборудование</div><div class="sm muted">${(DB.equipment||[]).length} поз. · вложено ${money(equipTotal())}</div></div>
    <span style="color:var(--muted)">›</span></div>`;
  if(!list.length) return h+`<div class="empty"><div class="em">🧾</div><div class="sm">За период трат нет. Нажми «＋ Добавить расход».</div></div>`;
  // группировка по дням
  const byDay={}; list.forEach(e=>{ (byDay[e.дата]=byDay[e.дата]||[]).push(e); });
  Object.keys(byDay).sort((a,b)=>b.localeCompare(a)).forEach(day=>{
    const items=byDay[day]; const dTot=items.reduce((s,e)=>s+e.сумма,0);
    h+=`<div class="section-title"><span>${fmtDateFull(day)}</span><span class="muted mono">${money(dTot)}</span></div>`;
    items.forEach(e=>{
      const isAuto=e.категория==='материалы' && e.материал_id;
      h+=`<div class="card${isAuto?'':' tap'}"${isAuto?'':` onclick="editExpense('${e.id}')"`}>
        <div class="row between">
          <div class="grow"><div class="title ell">${esc(e.заметка||EXP_CATS[e.категория]||'Расход')}</div>
            <div class="sm muted">${EXP_CATS[e.категория]||e.категория}${isAuto?' · со склада':''}</div></div>
          <div class="row" style="gap:10px">
            <div class="title mono">${money(e.сумма)}</div>
            ${isAuto?'':`<span class="iconbtn" onclick="event.stopPropagation();delExpense('${e.id}')">🗑</span>`}
          </div>
        </div>
      </div>`;
    });
  });
  return h;
}

  openSheet(id?'Изменить':'Новое оборудование', `
    <label class="fld"><span>Название</span><input id="eq_name" value="${esc(e.название||'')}" placeholder="Фен Dyson"></label>
    <div class="fld-row">
      <label class="fld"><span>Кол-во</span><input id="eq_qty" type="number" inputmode="numeric" value="${e.кол_во||1}"></label>
      <label class="fld"><span>Цена за шт, ₽</span><input id="eq_price" type="number" inputmode="numeric" value="${e.цена||''}" placeholder="30000"></label>
      <label class="fld"><span>Дата</span><input id="eq_date" type="date" value="${e.дата||new Date().toISOString().slice(0,10)}"></label>
    </div>`,
    [ id?`<button class="btn danger wauto" onclick="delEquip('${id}')">🗑</button>`:`<button class="btn ghost" onclick="equipSheet()">Назад</button>`,
      `<button class="btn" onclick="saveEquip('${id||''}')">Сохранить</button>`]);
}
function saveEquip(id){
  const g=x=>document.getElementById(x).value;
  const name=g('eq_name').trim(); if(!name) return toast('Введите название');
  const obj={ название:name, кол_во:+g('eq_qty')||1, цена:+g('eq_price')||0, дата:g('eq_date')||'' };
  if(id){ const i=DB.equipment.findIndex(x=>x.id===id); if(i>=0) DB.equipment[i]={...DB.equipment[i], ...obj}; }
  else { if(!DB.equipment)DB.equipment=[]; DB.equipment.push({id:uid('q'), ...obj}); }
  save(); equipSheet(); toast('Сохранено');
}
function delEquip(id){ confirmDo('Удалить оборудование из списка?', ()=>{
  DB.equipment=DB.equipment.filter(x=>x.id!==id); save(); equipSheet(); toast('Удалено'); }); }

/* ==================== ОТЧЁТ (аналитика) ==================== */
let _repPeriod='month';
const MONTHS_SHORT=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function setRepPeriod(p){ _repPeriod=p; document.getElementById('view').innerHTML=renderReport(); }
function workHours(w){ const t = w.время || ((sById(w.услуга_id)||{}).время_мин) || 0; return t/60; }
function renderReport(){
  const from=periodFrom(_repPeriod);
  const works=DB.works.filter(w=>w.дата>=from);
  const exps=(DB.expenses||[]).filter(e=>e.дата>=from);

  const rev=works.reduce((s,w)=>s+w.цена,0);
  const spend=exps.reduce((s,e)=>s+(e.сумма||0),0);
  const profit=rev-spend;
  const cost=works.reduce((s,w)=>s+w.себестоимость,0);
  const hours=works.reduce((s,w)=>s+workHours(w),0);

  const seg=`<div class="seg" style="margin-bottom:12px">${W_PERIODS.map(([k,l])=>
    `<button class="${_repPeriod===k?'on':''}" onclick="setRepPeriod('${k}')">${l}</button>`).join('')}</div>`;

  let h=seg;
  h+=`<div class="grid-stat">
    <div class="stat"><div class="lab">Выручка</div><div class="num mono">${money(rev)}</div></div>
    <div class="stat"><div class="lab">Расход</div><div class="num mono">${money(spend)}</div></div>
    <div class="stat"><div class="lab">Прибыль</div><div class="num mono" style="color:${profit>=0?'var(--green)':'var(--red)'}">${money(profit)}</div></div>
    <div class="stat"><div class="lab">Работ</div><div class="num mono">${works.length}</div></div>
  </div>`;
  h+=`<div class="card" style="margin-top:4px">
    <div class="kv"><span class="k">Средний чек</span><span class="v">${money(works.length?rev/works.length:0)}</span></div>
    <div class="kv"><span class="k">Доход в час</span><span class="v">${money(hours?rev/hours:0)}/ч</span></div>
    <div class="kv"><span class="k">Часов отработано</span><span class="v">${Math.round(hours*10)/10} ч</span></div>
  </div>`;

  // Расход по категориям (за период)
  const expByCat={}; exps.forEach(e=>expByCat[e.категория]=(expByCat[e.категория]||0)+(e.сумма||0));
  const catKeys=EXP_CAT_KEYS.filter(k=>expByCat[k]).sort((a,b)=>expByCat[b]-expByCat[a]);
  if(catKeys.length){
    h+=`<div class="section-title"><span>Расход по категориям</span></div>
      <div class="card">${catKeys.map(k=>`<div class="kv"><span class="k">${EXP_CATS[k]}</span><span class="v">${money(expByCat[k])}</span></div>`).join('')}</div>`;
  }

  // Сезонность — выручка по месяцам (всё время)
  const byMonth={};
  DB.works.forEach(w=>{ const k=w.дата.slice(0,7); byMonth[k]=(byMonth[k]||0)+w.цена; });
  const mk=Object.keys(byMonth).sort().slice(-8);
  if(mk.length>=2){
    const max=Math.max(...mk.map(k=>byMonth[k]));
    const best=mk.reduce((a,b)=>byMonth[b]>byMonth[a]?b:a, mk[0]);
    h+=`<div class="section-title"><span>Выручка по месяцам</span></div>
      <div class="card"><div class="mbars">${mk.map(k=>{
        const hp=Math.max(6, Math.round(byMonth[k]/max*100));
        const [y,mo]=k.split('-'); const isBest=k===best;
        return `<div class="mbar"><div class="mbar-v">${byMonth[k]>=1000?Math.round(byMonth[k]/1000)+'к':byMonth[k]}</div>
          <div class="mbar-t"><i style="height:${hp}%;background:${isBest?'var(--brand)':'var(--brand-soft)'}"></i></div>
          <div class="mbar-l">${MONTHS_SHORT[+mo-1]}</div></div>`;
      }).join('')}</div>
      <div class="sm muted" style="margin-top:8px">Лучший месяц: <b style="color:var(--brand)">${MONTHS_SHORT[+best.split('-')[1]-1]} ${best.split('-')[0]}</b> · ${money(byMonth[best])}</div></div>`;
  }

  // По услугам
  const bySvc={};
  works.forEach(w=>{ const o=bySvc[w.услуга_назв]=bySvc[w.услуга_назв]||{n:0,rev:0,marg:0};
    o.n++; o.rev+=w.цена; o.marg+=w.маржа; });
  const keys=Object.keys(bySvc);
  if(keys.length){
    const byRev=[...keys].sort((a,b)=>bySvc[b].rev-bySvc[a].rev);
    const topFreq=[...keys].sort((a,b)=>bySvc[b].n-bySvc[a].n)[0];
    const maxRev=bySvc[byRev[0]].rev;
    h+=`<div class="section-title"><span>По услугам</span></div>`;
    h+=`<div class="sm muted" style="margin:-4px 2px 8px">💰 Больше всех приносит: <b>${esc(byRev[0])}</b> · 🔁 чаще всего: <b>${esc(topFreq)}</b></div>`;
    byRev.forEach(k=>{const o=bySvc[k]; const rp=o.rev?Math.round(o.marg/o.rev*100):0;
      h+=`<div class="card">
        <div class="row between">
          <div class="grow"><div class="title ell">${esc(k)}</div>
            <div class="sm muted">${o.n} ${plural(o.n,'работа','работы','работ')} · ср. чек ${money(o.rev/o.n)}</div></div>
          <div style="text-align:right"><div class="title mono">${money(o.rev)}</div>
          <div class="xs" style="color:${margLevel(o.marg,o.rev).c}">маржа ${rp}%</div></div>
        </div>
        <div class="bar" style="margin-top:9px"><i style="width:${Math.max(4,Math.round(o.rev/maxRev*100))}%"></i></div>
      </div>`;
    });
  } else h+=`<div class="empty"><div class="em">📊</div><div class="sm">За период работ нет</div></div>`;

  // Итоги за всё время
  const allRev=DB.works.reduce((s,w)=>s+w.цена,0);
  const allSpend=(DB.expenses||[]).reduce((s,e)=>s+(e.сумма||0),0);
  const matSpend=(DB.expenses||[]).filter(e=>e.категория==='материалы').reduce((s,e)=>s+e.сумма,0);
  const stockVal=DB.materials.reduce((s,m)=>s+m.остаток_г*gpr(m),0)+DB.pieces.reduce((s,p)=>s+p.остаток_шт*p.цена_за_штуку,0);
  h+=`<div class="section-title"><span>Итоги за всё время</span></div>
    <div class="card">
      <div class="kv"><span class="k">Общая выручка</span><span class="v">${money(allRev)}</span></div>
      <div class="kv"><span class="k">Общий расход</span><span class="v">${money(allSpend)}</span></div>
      <div class="kv"><span class="k">Из них закуп материалов</span><span class="v">${money(matSpend)}</span></div>
      <div class="kv"><span class="k">Прибыль (касса)</span><span class="v" style="color:${allRev-allSpend>=0?'var(--green)':'var(--red)'}">${money(allRev-allSpend)}</span></div>
      <div class="kv"><span class="k">Заморожено в складе</span><span class="v">${money(stockVal)}</span></div>
      <div class="kv"><span class="k">Вложено в оборудование</span><span class="v">${money(equipTotal())}</span></div>
    </div>
    <div class="sm muted" style="margin:6px 2px 0">«Прибыль (касса)» — реальные деньги: выручка минус все траты. Маржа по услуге (цена − себестоимость) — отдельная метрика для ценообразования.</div>`;

  // Внимание
  const minusN=works.filter(w=>w.маржа<0).length;
  let wasteG=0, wasteR=0;
  works.forEach(w=>{ if(!w.остаток_смеси_г) return; let totG=0,totC=0;
    (w.шаги||[]).forEach(st=>{ const m=mById(st.материал_id); if(m){ totG+=st.факт_граммы; totC+=st.факт_граммы*gpr(m);
      const ox=st.оксид_id?mById(st.оксид_id):null; if(ox){ totG+=st.факт_оксида; totC+=st.факт_оксида*gpr(ox);} } });
    if(totG>0){ wasteG+=w.остаток_смеси_г; wasteR+=w.остаток_смеси_г/totG*totC; } });
  if(minusN||wasteG){
    h+=`<div class="section-title"><span>Внимание</span></div><div class="card">
      <div class="kv"><span class="k">Работы в минус</span><span class="v" style="color:${minusN?'var(--red)':'var(--green)'}">${minusN?minusN+' 🔴':'нет'}</span></div>
      <div class="kv"><span class="k">Смесь в отход</span><span class="v">${fmtG(wasteG)} г ≈ ${money(wasteR)}</span></div>
    </div>`;
  }
  h+=`<div style="height:12px"></div>`;
  return h;
}

/* ==================== СИНХРОНИЗАЦИЯ С СЕРВЕРОМ ==================== */
const SYNC_KEY='colorist_sync';
function syncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY))||null; }catch(e){ return null; } }
let _syncT=null, _sync={at:+localStorage.getItem('colorist_sync_at')||0, err:null, busy:false};
function syncUrl(c){ return c.url.replace(/\/+$/,'')+'/data'; }
function scheduleSync(){ const c=syncCfg(); if(!c||!c.url) return; clearTimeout(_syncT); _syncT=setTimeout(pushSync, 2000); }
async function pushSync(){
  const c=syncCfg(); if(!c||!c.url) return false;
  _sync.busy=true;
  try{
    const r=await fetch(syncUrl(c), {method:'PUT',
      headers:{'Content-Type':'application/json','X-Key':c.key||''},
      body:JSON.stringify({updatedAt:DB._updatedAt||Date.now(), db:DB})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    _sync.at=Date.now(); _sync.err=null;
    localStorage.setItem('colorist_sync_at', String(_sync.at));
    localStorage.setItem(BK_KEY, String(_sync.at)); // серверная копия = резервная копия
    return true;
  }catch(e){ _sync.err=(e&&e.message)||'нет связи'; return false; }
  finally{ _sync.busy=false; if(TAB==='settings') go('settings'); }
}
async function pullSync(){
  const c=syncCfg(); if(!c||!c.url) return false;
  try{
    const r=await fetch(syncUrl(c), {headers:{'X-Key':c.key||''}});
    if(r.status===404){ return pushSync(); }  // на сервере пусто — заливаем своё
    if(!r.ok) throw new Error('HTTP '+r.status);
    const remote=await r.json();
    const rAt=+(remote&&remote.updatedAt)||0, lAt=+DB._updatedAt||0;
    if(remote && remote.db && rAt>lAt){
      DB=remote.db; if(!DB.purchases)DB.purchases=[];
      localStorage.setItem(KEY, JSON.stringify(DB));
      go(TAB); toast('Данные обновлены с сервера ✓');
    } else if(lAt>rAt){ pushSync(); }
    _sync.at=Date.now(); _sync.err=null;
    localStorage.setItem('colorist_sync_at', String(_sync.at));
    localStorage.setItem(BK_KEY, String(_sync.at));
    return true;
  }catch(e){ _sync.err=(e&&e.message)||'нет связи'; return false; }
}
function syncStatusText(){
  const c=syncCfg();
  if(!c||!c.url) return 'Сервер не подключён. Данные живут только в этом браузере.';
  let s='Сервер: '+esc(c.url.replace(/^https?:\/\//,''));
  if(_sync.err) return s+` · <span style="color:var(--red)">ошибка: ${esc(_sync.err)}</span>`;
  if(!_sync.at) return s+' · ещё не синхронизировано';
  const m=Math.floor((Date.now()-_sync.at)/60000);
  return s+' · <span style="color:var(--green)">синх. '+(m<1?'только что':m+' мин назад')+' ✓</span>';
}
async function connectSync(){
  const url=(document.getElementById('sy_url').value||'').trim().replace(/\/+$/,'');
  const key=(document.getElementById('sy_key').value||'').trim();
  if(!/^https?:\/\//.test(url)) return toast('Адрес должен начинаться с https://');
  toast('Проверяю связь…');
  // При подключении сервер — источник истины: если там есть данные, берём их
  // (иначе свежеустановленное приложение затёрло бы учёт своим тестовым сидом).
  try{
    const r=await fetch(url+'/data', {headers:{'X-Key':key}});
    if(r.status===401) throw new Error('неверный ключ');
    if(r.status===404){ // сервер пуст — заливаем своё
      localStorage.setItem(SYNC_KEY, JSON.stringify({url,key}));
      const ok=await pushSync();
      if(!ok) throw new Error(_sync.err||'нет связи');
      toast('Подключено, данные сохранены на сервер ✓'); go('settings'); return;
    }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const remote=await r.json();
    if(!remote || !remote.db || !Array.isArray(remote.db.materials)) throw new Error('на сервере не данные учёта');
    localStorage.setItem(SYNC_KEY, JSON.stringify({url,key}));
    DB=remote.db; if(!DB.purchases)DB.purchases=[];
    localStorage.setItem(KEY, JSON.stringify(DB));
    _sync.at=Date.now(); _sync.err=null;
    localStorage.setItem('colorist_sync_at', String(_sync.at));
    localStorage.setItem(BK_KEY, String(_sync.at));
    go('settings'); toast('Подключено, данные загружены с сервера ✓');
  }catch(e){
    _sync.err=(e&&e.message)||'нет связи';
    go('settings'); toast('Не удалось: '+_sync.err);
  }
}
function disconnectSync(){
  confirmDo('Отключить синхронизацию с сервером? Данные на сервере останутся, но обновляться перестанут.', ()=>{
    localStorage.removeItem(SYNC_KEY); go('settings'); toast('Синхронизация отключена'); }, 'Отключить');
}
window.addEventListener('online', ()=>{ pushSync(); });

/* ==================== РЕЗЕРВНЫЕ КОПИИ ==================== */
const BK_KEY='colorist_backup_at';
function backupInfoText(){
  const t=localStorage.getItem(BK_KEY);
  if(!t) return '⚠️ Копия ещё ни разу не сохранялась. Данные живут только в этом браузере.';
  const days=Math.floor((Date.now()-+t)/86400000);
  if(days===0) return '✅ Последняя копия — сегодня.';
  if(days<=7) return `Последняя копия — ${days} ${plural(days,'день','дня','дней')} назад.`;
  return `⚠️ Последняя копия — ${days} ${plural(days,'день','дня','дней')} назад. Пора обновить.`;
}
function backupStale(){
  const t=localStorage.getItem(BK_KEY);
  if(!t) return DB.works.length>0;
  return (Date.now()-+t)/86400000 > 7;
}
function backupBlob(){
  const data={...DB, _экспорт:new Date().toISOString().slice(0,10), _приложение:'colorist-app'};
  return new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
}
function backupName(){ return 'учёт-колорист-'+new Date().toISOString().slice(0,10)+'.json'; }
function markBackedUp(){ localStorage.setItem(BK_KEY, String(Date.now())); }
function downloadBackup(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(backupBlob()); a.download=backupName();
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  markBackedUp(); toast('Копия скачана'); go('settings');
}
async function shareBackup(){
  const file=new File([backupBlob()], backupName(), {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Резервная копия учёта'});
      markBackedUp(); toast('Копия отправлена'); go('settings'); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  downloadBackup(); // на компьютере «поделиться» нет — просто скачиваем
}
function importBackup(input){
  const f=input.files && input.files[0]; input.value='';
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let data=null;
    try{ data=JSON.parse(r.result); }catch(e){}
    if(!data || !Array.isArray(data.materials) || !Array.isArray(data.works))
      return toast('Это не файл копии учёта');
    const n=data.works.length, m=data.materials.length;
    confirmDo(`Восстановить данные из копии${data._экспорт?' от '+data._экспорт:''}? (${m} материалов, ${n} работ). Текущие данные будут заменены.`, ()=>{
      delete data._экспорт; delete data._приложение;
      DB=data; if(!DB.purchases)DB.purchases=[];
      save(); markBackedUp(); go('stock'); toast('Данные восстановлены ✓');
    }, 'Восстановить');
  };
  r.readAsText(f);
}

/* ==================== УТИЛИТЫ ==================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtG(g){ return (Math.round(g*10)/10).toLocaleString('ru-RU'); }
function plural(n,a,b,c){ n=Math.abs(n)%100; const n1=n%10;
  if(n>10&&n<20)return c; if(n1>1&&n1<5)return b; if(n1===1)return a; return c; }
function fmtDate(iso){ const d=new Date(iso+'T00:00');
  const m=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const today=new Date().toISOString().slice(0,10);
  if(iso===today)return 'Сегодня';
  return d.getDate()+' '+m[d.getMonth()]; }
function fmtDateFull(iso){
  const today=new Date(); today.setHours(0,0,0,0);
  const y=new Date(today); y.setDate(y.getDate()-1);
  const t=today.toISOString().slice(0,10), yd=y.toISOString().slice(0,10);
  if(iso===t) return 'Сегодня';
  if(iso===yd) return 'Вчера';
  const d=new Date(iso+'T00:00');
  const M=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const wd=['вс','пн','вт','ср','чт','пт','сб'][d.getDay()];
  const s=d.getDate()+' '+M[d.getMonth()]+', '+wd;
  return d.getFullYear()!==today.getFullYear() ? s+' '+d.getFullYear() : s;
}
function deepc(o){ return JSON.parse(JSON.stringify(o)); }
function blankMatrix(val){ const o={}; LEN_K.forEach(l=>{o[l]={}; DEN_K.forEach(d=>{o[l][d]=deepc(val);});}); return o; }
function emptyBox(em,t,s){ return `<div class="empty"><div class="em">${em}</div><div class="title">${t}</div><div class="sm">${s}</div></div>`; }

/* Sheet */
function openSheet(title, bodyHtml, footBtns){
  document.getElementById('sheetTitle').innerHTML=title;
  document.getElementById('sheetBody').innerHTML=bodyHtml;
  document.getElementById('sheetFoot').innerHTML=(footBtns||[]).join('');
  document.getElementById('sheetFoot').style.display=(footBtns&&footBtns.length)?'flex':'none';
  document.getElementById('sheetBg').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.getElementById('fabWrap').style.display='none';
}
function closeSheet(){
  document.getElementById('sheetBg').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('fabWrap').style.display='';
}
/* Своё окно подтверждения (нативный confirm() блокируется в песочнице артефакта). */
let _confirmCb=null;
function confirmDo(msg, onYes, yesLabel){
  document.getElementById('confirmMsg').textContent=msg;
  const y=document.getElementById('confirmYes'); y.textContent=yesLabel||'Удалить';
  _confirmCb=onYes;
  document.getElementById('confirmBg').classList.add('open');
}
function closeConfirm(){ document.getElementById('confirmBg').classList.remove('open'); _confirmCb=null; }
function doConfirm(){ const cb=_confirmCb; closeConfirm(); if(cb)cb(); }
let _toastT;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),1800);
}
